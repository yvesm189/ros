<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  ROS font policy.

  Funnel Display becomes the generic sans-serif, which is what makes it the
  system font rather than only the GNOME interface font: applications that ask
  for "sans-serif" instead of a named family - which is most of them, and every
  web page - get the ROS face.

  This is done with a prepend match, not just an <alias><prefer>. Debian ships
  /etc/fonts/conf.d/60-latin.conf, which puts DejaVu and Noto at the head of the
  sans-serif list; an alias in a file that loads after it lands behind those and
  loses. Prepending to the family list wins regardless of what ran first, which
  is why the filename's sort order stops mattering.

  Noto and DejaVu stay behind Funnel Display on purpose. It covers Latin and
  Cyrillic; without a fallback, anything outside that coverage would render as
  boxes rather than simply in another face.
-->
<fontconfig>

  <match target="pattern">
    <test qual="any" name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Funnel Display</string>
    </edit>
  </match>

  <!-- Keep the generic alias too, for the code paths that read prefer lists
       rather than running pattern matches. -->
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Funnel Display</family>
      <family>Noto Sans</family>
      <family>DejaVu Sans</family>
    </prefer>
  </alias>

  <!-- Role names, so ROS applications can ask for a role instead of hardcoding
       a typeface. Changing the brand font then means editing this file. -->
  <alias binding="same">
    <family>ROS UI</family>
    <accept><family>Funnel Display</family></accept>
  </alias>
  <alias binding="same">
    <family>ROS Display</family>
    <accept><family>Space Grotesk</family></accept>
  </alias>

</fontconfig>
