# ROS management agent configuration.
#
# Leave `url` empty for a standalone workstation: the agent's timer will fire,
# find nothing to talk to, and exit quietly. Fill it in (or run
# `ros-agent enroll --server ... --key ...`) to bring the machine under
# management.

[server]
url =
enrollment_key =
verify_tls = true

[agent]
# Policy is applied on every sync unless this is turned off, which is useful
# when auditing what a console would do before letting it do it.
apply_policy = true
timeout = 20
log_level = INFO
