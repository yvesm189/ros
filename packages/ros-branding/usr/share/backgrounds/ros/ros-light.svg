<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160" width="3840" height="2160"
     preserveAspectRatio="xMidYMid slice">
  <title>ROS default wallpaper (light)</title>
  <defs>
    <linearGradient id="paper" x1="0.05" y1="0" x2="0.95" y2="1">
      <stop offset="0" stop-color="#FBFDFE"/>
      <stop offset="0.5" stop-color="#E6F0F7"/>
      <stop offset="1" stop-color="#A4C8E1"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.76" cy="0.16" r="0.6">
      <stop offset="0" stop-color="#0A79C7" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#0A79C7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="chevrons" width="600" height="300" patternUnits="userSpaceOnUse">
      <path d="M-300 260 L0 40 L300 260 L600 40 L900 260" fill="none"
            stroke="#06243A" stroke-opacity="0.13" stroke-width="14"
            stroke-linecap="round" stroke-linejoin="round"/>
    </pattern>
    <pattern id="chevronsAccent" width="600" height="300" patternUnits="userSpaceOnUse">
      <path d="M-300 260 L0 40 L300 260 L600 40 L900 260" fill="none"
            stroke="#C98A0B" stroke-opacity="0.30" stroke-width="14"
            stroke-linecap="round" stroke-linejoin="round"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <mask id="bandMask">
      <rect width="3840" height="2160" fill="url(#fade)"/>
    </mask>
  </defs>

  <rect width="3840" height="2160" fill="url(#paper)"/>
  <rect width="3840" height="2160" fill="url(#glow)"/>

  <g mask="url(#bandMask)" transform="rotate(-18 1920 1080)">
    <rect x="-600" y="1180" width="5040" height="300" fill="url(#chevronsAccent)"/>
    <rect x="-600" y="1480" width="5040" height="600" fill="url(#chevrons)"/>
  </g>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="30">
    <path d="M2460 1500 L3000 960 L3540 1500" stroke="#06243A" stroke-opacity="0.20"/>
    <path d="M2460 1140 L3000 600 L3540 1140" stroke="#C98A0B" stroke-opacity="0.30"/>
  </g>
</svg>
