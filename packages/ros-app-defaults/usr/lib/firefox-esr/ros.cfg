// ROS browser defaults. Plain, readable, and only defaults - a user can still
// change any of these.
//
// The first line of a Firefox autoconfig file is ignored by design, so it has
// to be a comment. Do not remove it.

defaultPref("font.default.x-western", "sans-serif");
defaultPref("font.name.sans-serif.x-western", "Funnel Display");
defaultPref("font.size.variable.x-western", 16);
defaultPref("browser.startup.homepage", "about:home");
defaultPref("browser.aboutConfig.showWarning", false);
defaultPref("datareporting.healthreport.uploadEnabled", false);
