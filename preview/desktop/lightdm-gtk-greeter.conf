# The ROS login screen.
#
# Set in the brand typeface, on the brand wallpaper, in the brand colour
# scheme, so that the first thing anybody sees already looks like ROS.

[greeter]
theme-name=Adwaita-dark
icon-theme-name=Adwaita
font-name=Funnel Display 11
xft-antialias=true
xft-hintstyle=slight
xft-rgba=rgb

background=/usr/share/backgrounds/ros/ros-dark.svg
user-background=false
default-user-image=#avatar-default-symbolic

clock-format=%A %d %B   %H:%M
indicators=~spacer;~clock;~spacer;~layout;~session;~power
position=50%,center 50%,center
