# When a session ends in the preview container, end it properly: no lingering
# user manager, no leftover gnome-session units for the next login to trip on.
#
# A real workstation keeps the Debian default - a user's background processes
# surviving a logout is often what somebody wants on a desktop they own. This
# container is a single-user appliance that is logged into and out of
# repeatedly, so the opposite default is the right one here.
[Login]
KillUserProcesses=yes
