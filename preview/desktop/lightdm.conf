# LightDM in VNC mode: it starts an Xvnc server for each incoming connection
# and runs the greeter on it, so a VNC client gets a login screen rather than
# somebody else's already-running session.

[LightDM]
minimum-display-number=1
minimum-vt=1

[VNCServer]
enabled=true
port=5900
listen-address=0.0.0.0
width=1600
height=900
depth=24
# -SecurityTypes None because the launcher publishes this on 127.0.0.1 only.
# The login screen is the authentication boundary here, not the VNC layer.
command=Xvnc -SecurityTypes None -AlwaysShared -desktop ROS

[Seat:*]
# GNOME on Xorg: Xvnc is an X server, so the Wayland session is not an option.
user-session=gnome-xorg
greeter-session=lightdm-gtk-greeter
allow-guest=false
greeter-hide-users=false
greeter-show-manual-login=false
