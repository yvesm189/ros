# LightDM in VNC mode: it starts an Xvnc server for each incoming connection
# and runs the greeter on it, so a VNC client gets a login screen rather than
# somebody else's already-running session.

[LightDM]
minimum-display-number=1
minimum-vt=1

[VNCServer]
enabled=true
port=5900
listen-address=0.0.0.0
width=1600
height=900
depth=24
# -SecurityTypes None because the launcher publishes this on 127.0.0.1 only.
# The login screen is the authentication boundary here, not the VNC layer.
command=Xvnc -SecurityTypes None -AlwaysShared -desktop ROS

[Seat:*]
# GNOME on Xorg: Xvnc is an X server, so the Wayland session is not an option.
# This needs gnome-session-xsession installed - Debian 13's gnome-session ships
# Wayland sessions only, and without the Xorg one LightDM silently falls back
# to lightdm-xsession, which exits immediately and takes the whole seat (and
# the VNC connection) down with it.
user-session=gnome-xorg
greeter-session=lightdm-gtk-greeter
allow-guest=false
greeter-hide-users=false
greeter-show-manual-login=false

# Tear the user's systemd units down when the session ends. Without this the
# second login of the day fails; see ros-session-cleanup for why.
session-cleanup-script=/usr/local/bin/ros-session-cleanup
